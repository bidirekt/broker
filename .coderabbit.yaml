# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  poem: false
  high_level_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  # CodeRabbit requests changes on a blocking finding and approves once every thread is resolved;
  # the main ruleset requires resolved threads and the CodeRabbit check, so a finding blocks the merge.
  auto_approvals:
    enabled: true
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**"
      instructions: |
        Comment only on bugs, security issues and improvements that prevent a concrete failure (wrong result, crash, data loss, race, leak, performance, broken contract). Each comment names the input or state that fails.
        Never comment on style, naming, formatting, comments, docstrings, documentation, test file layout, the PR title or the PR description.
    - path: "internal/**/*.go"
      instructions: |
        - Wire JSON keys are camelCase; a snake_case key on the wire breaks the CLI.
    - path: "internal/contracts/**/*.go"
      instructions: |
        - Invalid input that feeds a hash or a match key (e.g. a {param} path segment) is rejected at publish with a 400 validation error, never silently normalized into a valid one. Only meaning-free spelling (a trailing /) is normalized.
        - Dynamic endpoint path segments are * (one segment each); {param} is rejected.
        - Reason codes go to the wire verbatim; never strip the property_ prefix, it tells property-level from resource-level.
        - Consumer/provider roles in a breaking change come from IsConsumer()/IsProvider(), never from argument or slice position.
