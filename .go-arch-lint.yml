version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  cmd:                        { in: cmd/** }
  bootstrap:                  { in: internal }
  feature_can_i_deploy:       { in: internal/features/can_i_deploy }
  feature_create_environment: { in: internal/features/create_environment }
  feature_create_participant: { in: internal/features/create_participant }
  feature_health:             { in: internal/features/health }
  feature_list_environments:  { in: internal/features/list_environments }
  feature_list_participants:  { in: internal/features/list_participants }
  feature_publish_contract:   { in: internal/features/publish_contract }
  feature_record_deployment:  { in: internal/features/record_deployment }
  feature_rename_participant: { in: internal/features/rename_participant }
  feature_validate_contract:  { in: internal/features/validate_contract }
  components:                 { in: internal/components }
  contracts:                  { in: internal/contracts/** }
  repository:                 { in: internal/repository }
  model:                      { in: internal/model }
  validations:                { in: internal/validations }
  pkg:                        { in: pkg/** }
  migrations:                 { in: migrations }
  tests:                      { in: tests/** }

vendors:
  fiber:          { in: [github.com/gofiber/fiber/v3, github.com/gofiber/fiber/v3/**] }
  pgx:            { in: [github.com/jackc/pgx/v5, github.com/jackc/pgx/v5/**] }
  guregu_null:    { in: [github.com/guregu/null, github.com/guregu/null/**] }
  yaml:           { in: [github.com/goccy/go-yaml, github.com/goccy/go-yaml/**] }
  testify:        { in: [github.com/stretchr/testify, github.com/stretchr/testify/**] }
  testcontainers: { in: [github.com/testcontainers/testcontainers-go, github.com/testcontainers/testcontainers-go/**] }

deps:
  cmd:
    mayDependOn: [bootstrap]

  bootstrap:
    mayDependOn:
      - components
      - feature_can_i_deploy
      - feature_create_environment
      - feature_create_participant
      - feature_health
      - feature_list_environments
      - feature_list_participants
      - feature_publish_contract
      - feature_record_deployment
      - feature_rename_participant
      - feature_validate_contract
    canUse: [fiber]

  feature_can_i_deploy:
    mayDependOn: [contracts, components, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_create_environment:
    mayDependOn: [components, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_create_participant:
    mayDependOn: [components, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_health:
    mayDependOn: [components]
    canUse: [fiber]
  feature_list_environments:
    mayDependOn: [components, repository, model]
    canUse: [fiber]
  feature_list_participants:
    mayDependOn: [components, repository, model]
    canUse: [fiber]
  feature_publish_contract:
    mayDependOn: [contracts, components, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_record_deployment:
    mayDependOn: [components, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_rename_participant:
    mayDependOn: [components, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_validate_contract:
    mayDependOn: [contracts, components, repository, model, validations]
    canUse: [fiber, guregu_null]

  components:
    mayDependOn: [model, pkg, migrations]
    canUse: [fiber, pgx]
  contracts:
    mayDependOn: [contracts, model, validations]
    canUse: [yaml, guregu_null]
  repository:
    mayDependOn: [model, validations]
    canUse: [pgx, guregu_null]

  model:
    canUse: [guregu_null]

  pkg:
    canUse: [pgx]

  tests:
    mayDependOn:
      - bootstrap
      - components
      - contracts
      - feature_can_i_deploy
      - feature_create_environment
      - feature_create_participant
      - feature_health
      - feature_list_environments
      - feature_list_participants
      - feature_publish_contract
      - feature_record_deployment
      - feature_rename_participant
      - feature_validate_contract
      - repository
      - model
      - validations
      - pkg
    canUse: [fiber, pgx, guregu_null, yaml, testify, testcontainers]
