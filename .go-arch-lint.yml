version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  cmd:                        { in: cmd/** }
  bootstrap:                  { in: internal }
  feature_can_i_deploy:       { in: internal/features/can_i_deploy }
  feature_create_environment: { in: internal/features/create_environment }
  feature_create_participant: { in: internal/features/create_participant }
  feature_deactivate_user:    { in: internal/features/deactivate_user }
  feature_edit_user:          { in: internal/features/edit_user }
  feature_generate_link:      { in: internal/features/generate_link }
  feature_health:             { in: internal/features/health }
  feature_invite_user:        { in: internal/features/invite_user }
  feature_list_environments:  { in: internal/features/list_environments }
  feature_list_participants:  { in: internal/features/list_participants }
  feature_list_users:         { in: internal/features/list_users }
  feature_publish_contract:   { in: internal/features/publish_contract }
  feature_reactivate_user:    { in: internal/features/reactivate_user }
  feature_record_deployment:  { in: internal/features/record_deployment }
  feature_rename_environment: { in: internal/features/rename_environment }
  feature_rename_participant: { in: internal/features/rename_participant }
  feature_set_password:       { in: internal/features/set_password }
  feature_setup_admin:        { in: internal/features/setup_admin }
  feature_show_check:         { in: internal/features/show_check }
  feature_sign_in:            { in: internal/features/sign_in }
  feature_sign_out:           { in: internal/features/sign_out }
  feature_update_profile:     { in: internal/features/update_profile }
  feature_validate_contract:  { in: internal/features/validate_contract }
  components:                 { in: internal/components }
  components_config:        { in: internal/components/config }
  components_passwords:     { in: internal/components/passwords }
  components_tokens:        { in: internal/components/tokens }
  components_input:         { in: internal/components/input }
  components_access:        { in: internal/components/access }
  components_breakreport:   { in: internal/components/breakreport }
  components_pages:         { in: internal/components/pages }
  components_respond:       { in: internal/components/respond }
  components_bearer:        { in: internal/components/bearer }
  components_sessions:      { in: internal/components/sessions }
  components_database:      { in: internal/components/database }
  components_server:        { in: internal/components/server }
  contracts:                  { in: internal/contracts/** }
  repository:                 { in: internal/repository }
  model:                      { in: internal/model }
  validations:                { in: internal/validations }
  pkg:                        { in: pkg/** }
  migrations:                 { in: migrations }
  tests:                      { in: tests/** }

vendors:
  fiber:          { in: [github.com/gofiber/fiber/v3, github.com/gofiber/fiber/v3/**] }
  pgx:            { in: [github.com/jackc/pgx/v5, github.com/jackc/pgx/v5/**] }
  guregu_null:    { in: [github.com/guregu/null, github.com/guregu/null/**] }
  yaml:           { in: [github.com/goccy/go-yaml, github.com/goccy/go-yaml/**] }
  testify:        { in: [github.com/stretchr/testify, github.com/stretchr/testify/**] }
  testcontainers: { in: [github.com/testcontainers/testcontainers-go, github.com/testcontainers/testcontainers-go/**] }
  x_crypto:       { in: [golang.org/x/crypto/**] }
  golang_jwt:     { in: [github.com/golang-jwt/jwt/v5, github.com/golang-jwt/jwt/v5/**] }
  fasthttp:       { in: [github.com/valyala/fasthttp, github.com/valyala/fasthttp/**] }

deps:
  cmd:
    mayDependOn: [bootstrap]

  bootstrap:
    mayDependOn:
      - components
      - components_config
      - feature_can_i_deploy
      - feature_create_environment
      - feature_create_participant
      - feature_deactivate_user
      - feature_edit_user
      - feature_generate_link
      - feature_health
      - feature_invite_user
      - feature_list_environments
      - feature_list_participants
      - feature_list_users
      - feature_publish_contract
      - feature_reactivate_user
      - feature_record_deployment
      - feature_rename_environment
      - feature_rename_participant
      - feature_set_password
      - feature_setup_admin
      - feature_show_check
      - feature_sign_in
      - feature_sign_out
      - feature_update_profile
      - feature_validate_contract
    canUse: [fiber]

  feature_can_i_deploy:
    mayDependOn: [contracts, components, components_access, repository, model, validations]
    canUse: [fiber, guregu_null]
  feature_create_environment:
    mayDependOn: [components, components_access, repository, model, validations]
    canUse: [fiber]
  feature_create_participant:
    mayDependOn: [components, components_access, repository, model, validations]
    canUse: [fiber]
  feature_deactivate_user:
    mayDependOn: [components, components_access, components_pages, components_respond, components_sessions, repository, model]
    canUse: [fiber]
  feature_edit_user:
    mayDependOn: [components, components_access, components_pages, components_respond, repository, model, validations]
    canUse: [fiber]
  feature_generate_link:
    mayDependOn: [components, components_access, components_pages, components_respond, components_tokens, repository, model]
    canUse: [fiber]
  feature_health:
    mayDependOn: [components]
    canUse: [fiber]
  feature_invite_user:
    mayDependOn: [components, components_access, components_pages, components_respond, components_tokens, repository, model, validations]
    canUse: [fiber]
  feature_list_environments:
    mayDependOn: [components, components_access, repository, model]
    canUse: [fiber]
  feature_list_participants:
    mayDependOn: [components, components_access, repository, model]
    canUse: [fiber]
  feature_list_users:
    mayDependOn: [components, components_access, components_pages, components_respond, repository, model]
    canUse: [fiber]
  feature_publish_contract:
    mayDependOn: [contracts, components, components_access, repository, model, validations]
    canUse: [fiber]
  feature_reactivate_user:
    mayDependOn: [components, components_access, components_pages, components_respond, components_sessions, repository, model]
    canUse: [fiber]
  feature_record_deployment:
    mayDependOn: [components, components_access, repository, model, validations]
    canUse: [fiber]
  feature_rename_environment:
    mayDependOn: [components, components_access, repository, model, validations]
    canUse: [fiber]
  feature_rename_participant:
    mayDependOn: [components, components_access, repository, model, validations]
    canUse: [fiber]
  feature_set_password:
    mayDependOn: [components, components_access, components_pages, components_passwords, components_respond, components_sessions, components_tokens, repository, validations]
    canUse: [fiber]
  feature_setup_admin:
    mayDependOn: [components, components_access, components_pages, components_passwords, components_respond, components_sessions, repository, model, validations]
    canUse: [fiber]
  feature_show_check:
    mayDependOn: [components, components_access, components_breakreport, components_pages, components_respond, repository, model]
    canUse: [fiber, guregu_null]
  feature_sign_in:
    mayDependOn: [components, components_access, components_bearer, components_config, components_pages, components_passwords, components_respond, components_sessions, repository, model]
    canUse: [fiber]
  feature_sign_out:
    mayDependOn: [components, components_access, components_pages, components_sessions, repository]
    canUse: [fiber]
  feature_update_profile:
    mayDependOn: [components, components_access, components_pages, components_passwords, components_respond, components_sessions, repository, model, validations]
    canUse: [fiber]
  feature_validate_contract:
    mayDependOn: [contracts, components, components_access, repository, model, validations]
    canUse: [fiber]

  components:
    mayDependOn: [components_config, components_database, components_server, components_sessions, repository]
    canUse: [fiber, pgx]
  components_access:
    mayDependOn: [model]
    canUse: [fiber]
  components_breakreport:
    mayDependOn: [model]
  components_bearer:
    mayDependOn: [components_access, components_config, components_respond, repository]
    canUse: [fiber, golang_jwt]
  components_database:
    mayDependOn: [components_config, pkg, migrations]
    canUse: [pgx]
  components_input:
    mayDependOn: [components_respond]
    canUse: [fiber, fasthttp]
  components_pages:
    mayDependOn: [components_access]
    canUse: [fiber]
  components_passwords:
    canUse: [x_crypto]
  components_respond:
    mayDependOn: [components_pages]
    canUse: [fiber]
  components_server:
    mayDependOn: [components_bearer, components_config, components_input, components_pages, components_respond, components_sessions, repository]
    canUse: [fiber, pgx]
  components_sessions:
    mayDependOn: [components_access, components_config, components_pages, components_respond, components_tokens, repository, model]
    canUse: [fiber]
  contracts:
    mayDependOn: [contracts, model, validations]
    canUse: [yaml, guregu_null]
  repository:
    mayDependOn: [model]
    canUse: [pgx, guregu_null]

  model:
    canUse: [guregu_null]

  pkg:
    canUse: [pgx]

  tests:
    mayDependOn:
      - bootstrap
      - components
      - components_bearer
      - components_breakreport
      - components_config
      - components_database
      - components_pages
      - components_passwords
      - components_tokens
      - contracts
      - feature_health
      - migrations
      - repository
      - model
      - validations
      - pkg
    canUse: [fiber, pgx, guregu_null, yaml, testify, testcontainers, golang_jwt]
