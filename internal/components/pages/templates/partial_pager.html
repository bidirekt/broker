{{define "pager"}}<div class="sheet-foot">
  <span>showing {{.First}}–{{.Last}} of {{.Total}}</span>
  {{template "pager_nav" .}}
</div>{{end}}

{{define "pager_nav"}}<nav class="pager" aria-label="Pages">
    {{with .PreviousURL}}<a href="{{.}}" rel="prev">Previous</a>{{else}}<span class="off">Previous</span>{{end}}
    <span aria-current="page">{{.Page}}</span>
    {{with .NextURL}}<a href="{{.}}" rel="next">Next</a>{{else}}<span class="off">Next</span>{{end}}
  </nav>{{end}}
