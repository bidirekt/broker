<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · Bidirekt</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/app.js"></script>
</head>
<body hx-boost="true" hx-headers='{"X-CSRF-Token": "{{.CSRFToken}}"}'>
  <header class="topbar">
    <div class="frame topbar-inner">
      <span class="brand">{{template "mark"}}Bidirekt</span>
      <nav class="nav" aria-label="Main">
        {{if .IsAdmin}}
        <a href="/users"{{if eq .Section "users"}} aria-current="page"{{end}}>Users</a>
        {{else}}
        <a href="/profile"{{if eq .Section "profile"}} aria-current="page"{{end}}>Profile</a>
        {{end}}
      </nav>
      <form class="sign-out" method="post" action="/sign-out">
        <button type="submit">Sign out</button>
      </form>
    </div>
  </header>
  <main class="sheet">
    <div class="frame">
      {{template "content" .}}
    </div>
  </main>
</body>
</html>
