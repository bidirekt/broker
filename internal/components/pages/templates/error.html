{{define "title"}}{{.Page.Message}}{{end}}

{{define "content"}}
<section class="sheet errpage">
  <div class="code-n">{{.Page.Status}}</div>
  <h1>{{.Page.Message}}</h1>
  <div class="actions">
    {{if eq .Page.Method "GET"}}
    <a class="btn primary" href="">Try again</a>
    <a class="btn" href="/">Go to overview</a>
    {{else}}
    <a class="btn primary" href="/">Go to overview</a>
    {{end}}
  </div>
</section>
{{end}}
