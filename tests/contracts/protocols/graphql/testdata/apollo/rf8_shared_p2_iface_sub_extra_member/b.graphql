extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
type Query { holder: Holder @shareable }
type Holder @shareable { item: Animal }
interface Node { id: ID! }
interface Animal implements Node { id: ID! name: String }
type Dog implements Animal & Node @shareable { id: ID! name: String }
type Bird implements Node @shareable { id: ID! wings: Int }
